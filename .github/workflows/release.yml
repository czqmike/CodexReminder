name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

jobs:
  build:
    name: Build release artifact
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/check-release.js "$GITHUB_REF_NAME"
      - run: npm run verify:package
      - uses: actions/upload-artifact@v4
        with:
          name: codex-reminder-vsix
          path: dist/codex-reminder.vsix
          if-no-files-found: error
          retention-days: 30

  github-release:
    name: Create GitHub Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: codex-reminder-vsix
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME"
          dist/codex-reminder.vsix
          --repo "$GITHUB_REPOSITORY"
          --verify-tag
          --title "Codex Reminder ${GITHUB_REF_NAME#v}"
          --generate-notes

  marketplace:
    name: Publish to VS Code Marketplace
    if: vars.MARKETPLACE_OIDC_ENABLED == 'true'
    needs:
      - build
      - github-release
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: codex-reminder-vsix
          path: dist
      - run: npm run publish:marketplace
